<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Content menu swipes, as you see your hands. Open: right hand swipes right to left, or left hand swipes left to right. Close: right hand swipes left to right, or left hand swipes right to left.">
  <defs>
    <marker id="headGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#e8c36a"/></marker>
    <marker id="headAzure" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8fb2ff"/></marker>
    <!-- an open hand, palm towards you, fingers up; the thumb points to the body's middle for a right hand -->
    <g id="rightHand">
      <rect x="-20" y="-12" width="40" height="40" rx="14" fill="#f5f2ea"/>
      <rect x="-19" y="-44" width="9" height="38" rx="4.5" fill="#f5f2ea"/>
      <rect x="-8" y="-52" width="9" height="46" rx="4.5" fill="#f5f2ea"/>
      <rect x="3" y="-49" width="9" height="43" rx="4.5" fill="#f5f2ea"/>
      <rect x="13" y="-40" width="8" height="34" rx="4" fill="#f5f2ea"/>
      <rect x="-40" y="0" width="26" height="10" rx="5" fill="#f5f2ea" transform="rotate(-35 -20 5)"/>
    </g>
    <g id="leftHand"><use href="#rightHand" transform="scale(-1 1)"/></g>
  </defs>
  <style>
    .t{font-family:'Space Grotesk','Inter','Segoe UI',system-ui,-apple-system,sans-serif}
    .m{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
  </style>
  <rect width="960" height="470" rx="24" fill="#07080c"/>
  <text x="40" y="52" class="m" font-size="14" letter-spacing="2" fill="#e8c36a">IMMERSIVEX · CONTENT MENU</text>
  <text x="40" y="84" class="t" font-size="26" font-weight="700" fill="#f5f2ea">Swipe one hand sideways, as you see it in front of you</text>

  <!-- open -->
  <rect x="40" y="108" width="430" height="290" rx="18" fill="#0b0d13" stroke="rgba(232,195,106,0.35)"/>
  <text x="64" y="144" class="t" font-size="22" font-weight="700" fill="#e8c36a">Open</text>
  <text x="128" y="144" class="t" font-size="16" fill="#c4beb1">towards the middle of your body</text>
  <g transform="translate(64 168)">
    <text x="0" y="22" class="m" font-size="13" letter-spacing="1" fill="#8d8779">RIGHT HAND</text>
    <line x1="350" y1="78" x2="130" y2="78" stroke="#e8c36a" stroke-width="5" stroke-linecap="round" marker-end="url(#headGold)"/>
    <use href="#rightHand" transform="translate(360 84) scale(0.8)"/>
    <text x="130" y="112" class="t" font-size="14" fill="#c4beb1">right → left</text>
  </g>
  <g transform="translate(64 278)">
    <text x="0" y="22" class="m" font-size="13" letter-spacing="1" fill="#8d8779">LEFT HAND</text>
    <line x1="40" y1="78" x2="260" y2="78" stroke="#e8c36a" stroke-width="5" stroke-linecap="round" marker-end="url(#headGold)"/>
    <use href="#leftHand" transform="translate(30 84) scale(0.8)"/>
    <text x="180" y="112" class="t" font-size="14" fill="#c4beb1">left → right</text>
  </g>

  <!-- close -->
  <rect x="490" y="108" width="430" height="290" rx="18" fill="#0b0d13" stroke="rgba(143,178,255,0.35)"/>
  <text x="514" y="144" class="t" font-size="22" font-weight="700" fill="#8fb2ff">Close</text>
  <text x="584" y="144" class="t" font-size="16" fill="#c4beb1">the reverse: away from the middle</text>
  <g transform="translate(514 168)">
    <text x="0" y="22" class="m" font-size="13" letter-spacing="1" fill="#8d8779">RIGHT HAND</text>
    <line x1="140" y1="78" x2="360" y2="78" stroke="#8fb2ff" stroke-width="5" stroke-linecap="round" marker-end="url(#headAzure)"/>
    <use href="#rightHand" transform="translate(110 84) scale(0.8)"/>
    <text x="270" y="112" class="t" font-size="14" fill="#c4beb1">left → right</text>
  </g>
  <g transform="translate(514 278)">
    <text x="0" y="22" class="m" font-size="13" letter-spacing="1" fill="#8d8779">LEFT HAND</text>
    <line x1="250" y1="78" x2="30" y2="78" stroke="#8fb2ff" stroke-width="5" stroke-linecap="round" marker-end="url(#headAzure)"/>
    <use href="#leftHand" transform="translate(280 84) scale(0.8)"/>
    <text x="30" y="112" class="t" font-size="14" fill="#c4beb1">right → left</text>
  </g>

  <text x="40" y="430" class="t" font-size="15" fill="#8d8779">A quick swipe: about 22 cm in under 0.3 s, in front of you between chest and forehead. Hands or controllers.</text>
  <text x="40" y="452" class="t" font-size="15" fill="#8d8779">Both hands at once (a clap) doesn't count, and the hand's way back after a swipe is ignored.</text>
</svg>
